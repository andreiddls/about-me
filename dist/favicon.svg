<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .bg {
        fill: #111318;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1;
      }
      .glyph {
        fill: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        .bg {
          fill: #0c0d12;
          stroke: rgba(255, 255, 255, 0.2);
          stroke-width: 1;
        }
        .glyph {
          fill: #ffffff;
        }
      }
    </style>
  </defs>

  <!-- Background Squircle -->
  <rect class="bg" x="1" y="1" width="30" height="30" rx="7" />

  <!-- Monogram AT (Geometric Swiss Typography) -->
  <g class="glyph">
    <!-- Letter A -->
    <path d="M 10.2 9 L 11.8 9 L 16.5 22.5 L 14.1 22.5 L 13.1 19.4 L 8.9 19.4 L 7.9 22.5 L 5.5 22.5 Z M 11.0 12.3 L 12.4 17.3 L 9.6 17.3 Z" />
    <!-- Letter T -->
    <path d="M 17.5 9 L 26.5 9 L 26.5 11.2 L 23.2 11.2 L 23.2 22.5 L 20.8 22.5 L 20.8 11.2 L 17.5 11.2 Z" />
  </g>
</svg>
