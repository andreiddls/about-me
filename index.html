<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrei Tolstykh — Senior Product Designer | 🇩🇪 Saarbrücken, Germany</title>
    <meta name="description"
        content="Senior Product Designer with 6+ years in FinTech and AI. B2B platforms and scalable product experiences.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="page-wrapper">
        <main class="bento-layout">
            <!-- LEFT COLUMN (70%) -->
            <div class="col-left">
                <!-- Tile 1: About Me -->
                <article class="bento-tile tile-about" data-tile="about">
                    <div class="about-photo">
                        <img id="about-avatar-img" src="/avatar.png" alt="Andrei Tolstykh" loading="lazy"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div id="about-avatar-placeholder" class="avatar-placeholder" style="display:none;">AT</div>
                    </div>
                    <div class="tile-content about-body">
                        <div class="about-meta">
                            <h1 id="about-name"></h1>
                            <p class="subtitle"><span id="about-subtitle"></span> <span id="about-location"></span></p>
                        </div>
                        <p class="about-text" id="about-text"></p>
                        <div class="about-links" id="about-links">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </article>

                <!-- Tile 2: Selected Projects -->
                <article class="bento-tile tile-projects" data-tile="projects">
                    <div class="tile-content">
                        <h2>Selected Projects</h2>
                        <div class="projects-list" id="projects-list">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </article>

                <!-- Tile 3: Experience -->
                <article class="bento-tile tile-experience" data-tile="experience">
                    <div class="tile-content">
                        <h2>Experience</h2>
                        <div class="exp-timeline" id="experience-list">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </article>


            </div>

            <!-- RIGHT COLUMN (30%) -->
            <div class="col-right">
                <!-- Tile 4: Education & Languages -->
                <article class="glass-panel animate-on-scroll" data-tile="education">
                    <h2 class="glass-title">Education & Certifications</h2>
                    <div class="glass-list" id="education-list">
                        <!-- Populated via JS -->
                    </div>

                    <h2 class="glass-title" style="margin-top: var(--space-2);">Languages</h2>
                    <div class="glass-list" id="languages-list">
                        <!-- Populated via JS -->
                    </div>
                </article>

                <!-- Tile 5: Skills & Tools -->
                <article class="glass-panel animate-on-scroll" data-tile="skills">
                    <h2 class="glass-title">Skills & Tools</h2>
                    <div class="glass-list" id="skills-list">
                        <!-- Populated via JS -->
                    </div>
                </article>

                <!-- Tile 6: Contact / CTA -->
                <article class="glass-panel animate-on-scroll" data-tile="contact">
                    <h2 class="glass-title">Let's work together</h2>
                    <div class="inner-card">
                        <p class="contact-text"
                            style="margin-bottom: var(--space-4); font-size: 0.85rem; color: var(--text-secondary);">
                            Open for senior product design roles and consulting in B2B/FinTech.</p>
                        <div class="contact-actions"
                            style="display: flex; flex-direction: column; gap: var(--space-2);">
                            <a href="mailto:tolstykhandrew@gmail.com" class="btn-primary">
                                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" />
                                </svg>
                                Send Email
                            </a>
                            <a href="https://linkedin.com/in/tolstykhaa" target="_blank" rel="noopener"
                                class="btn-secondary">
                                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                                </svg>
                                LinkedIn
                            </a>
                        </div>
                    </div>
                </article>
            </div>
        </main>
    </div>

    <!-- Project Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M18.3 5.71a1 1 0 00-1.41 0L12 10.59 7.11 5.7A1 1 0 005.7 7.11L10.59 12 5.7 16.89a1 1 0 101.41 1.41L12 13.41l4.89 4.89a1 1 0 001.41-1.41L13.41 12l4.89-4.89a1 1 0 000-1.4z" />
                </svg>
            </button>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <circle cx="12" cy="12" r="5" />
            <rect x="11" y="1.5" width="2" height="3.5" rx="1" />
            <rect x="11" y="1.5" width="2" height="3.5" rx="1" transform="rotate(45 12 12)" />
            <rect x="11" y="1.5" width="2" height="3.5" rx="1" transform="rotate(90 12 12)" />
            <rect x="11" y="1.5" width="2" height="3.5" rx="1" transform="rotate(135 12 12)" />
            <rect x="11" y="1.5" width="2" height="3.5" rx="1" transform="rotate(180 12 12)" />
            <rect x="11" y="1.5" width="2" height="3.5" rx="1" transform="rotate(225 12 12)" />
            <rect x="11" y="1.5" width="2" height="3.5" rx="1" transform="rotate(270 12 12)" />
            <rect x="11" y="1.5" width="2" height="3.5" rx="1" transform="rotate(315 12 12)" />
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="currentColor">
            <path
                d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z" />
        </svg>
    </button>

    <script type="module" src="/js/main.js"></script>
</body>

</html>
